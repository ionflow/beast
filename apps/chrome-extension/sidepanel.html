<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beast Capture</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="beast-capture-shell">
      <header class="beast-capture-header">
        <h1>Beast Capture</h1>
        <button id="refresh-projects" type="button" title="Reload saved Beast projects from the desktop app">Refresh Projects</button>
      </header>

      <form id="capture-form">
        <label>
          Project
          <select id="project-select" required></select>
        </label>

        <div class="capture-type" aria-label="Capture type">
          <button class="is-active" type="button">Website</button>
          <button type="button" disabled>Local File</button>
        </div>

        <label>
          Stack
          <div id="stack-picker" class="stack-picker">
            <select id="stack-select" required></select>
            <button id="new-stack" class="icon-button" type="button" title="Create a new Beast research stack" aria-label="New Stack">
              +
            </button>
          </div>
          <div id="stack-create" class="stack-create is-hidden">
            <input id="new-stack-title" placeholder="Stack title" />
            <button id="cancel-new-stack" class="icon-button" type="button" title="Cancel new stack" aria-label="Cancel New Stack">
              X
            </button>
            <button id="save-new-stack" class="icon-button" type="button" title="Save new stack" aria-label="Save New Stack">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3h12l2 2v16H5z" />
                <path d="M8 3v6h8V3" />
                <path d="M8 15h8v6H8z" />
              </svg>
            </button>
          </div>
        </label>

        <label>
          Title
          <input id="capture-title" required />
        </label>

        <label>
          URL
          <input id="capture-url" type="url" required />
        </label>

        <label>
          Notes
          <textarea id="capture-note" rows="5" placeholder="Why this matters to the script."></textarea>
        </label>

        <label>
          Selection
          <textarea id="selection-text" rows="5" placeholder="Select text on the page or use the context menu."></textarea>
        </label>

        <label class="checkbox-row">
          <input id="include-screenshot" type="checkbox" />
          Capture visible tab as JPG
        </label>

        <div class="actions">
          <button id="use-current-tab" type="button" title="Fill title, URL, and selected text from the active Chrome tab">Use Current Tab</button>
          <button type="submit" title="Send this capture to the selected Beast project">Save to Beast</button>
        </div>

        <p id="status" role="status">Open Beast desktop with a saved project.</p>
      </form>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
